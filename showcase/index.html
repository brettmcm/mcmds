<!doctype html>
<html lang="en" data-mcm-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCMDS</title>
  <link rel="stylesheet" href="https://use.typekit.net/shq4xoc.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/mcmds.css">
  <link rel="stylesheet" href="./showcase.css">
</head>
<body>
  <main>
    <header>
      <strong>MCMDS</strong>
      <button class="theme" type="button" aria-label="Switch to dark theme">
        <span aria-hidden="true"></span>
        <b>Light</b>
      </button>
    </header>

    <section>
      <div class="statement">
        <h1>Less,<br>but clear.</h1>
        <i aria-hidden="true"></i>
      </div>

      <div class="work" aria-label="Example work">
        <p>Current work</p>
        <button type="button">
          <span>Define the field</span>
          <small>Complete</small>
        </button>
        <button class="is-selected" type="button" aria-pressed="true">
          <span>Remove the extra layer</span>
          <small>Selected</small>
        </button>
        <button type="button">
          <span>Keep only what helps</span>
          <small>Next</small>
        </button>
      </div>
    </section>
  </main>
  <script src="./showcase.js"></script>
</body>
</html>
